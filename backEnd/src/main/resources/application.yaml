#   driverClassName: com.mysql.cj.jdbc.Driver
#   username: root
#   password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true

