spring:
  application:
    name: huertohogar-backend
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: ""
    generate-unique-name: false
#   MySQL (Ev3): reemplazar las 4 líneas anteriores por estas y usar org.hibernate.dialect.MySQLDialect
